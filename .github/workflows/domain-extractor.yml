name: Domain Extractor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  domain-extractor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install

      - name: Run Domain Extractor smoke test
        run: npm run test:domain-extractor
