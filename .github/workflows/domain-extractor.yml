name: Domain Extractor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This workflow only reads source files and runs tests.
# Grant the minimum required repository permission.
permissions:
  contents: read

jobs:
  domain-extractor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install

      - name: Validate repository JavaScript syntax
        run: npm run check:js-syntax

      - name: Run Domain Extractor smoke test
        run: npm run test:domain-extractor

      - name: Run password security regression test
        run: npm run test:password-security

      - name: Run output escaping regression test
        run: npm run test:output-escaping

      - name: Run IP analyzer regression test
        run: npm run test:ip-analyzer

      - name: Run file hash checker regression test
        run: npm run test:file-hash-checker

      - name: Run hash generator lifecycle regression test
        run: npm run test:hash-generator

      - name: Run email format checker regression test
        run: npm run test:email-validator

      - name: Run link analyzer scope regression test
        run: npm run test:link-analyzer

      - name: Run text analyzer Unicode regression test
        run: npm run test:text-analyzer

      - name: Run Base64 data integrity regression test
        run: npm run test:base64-integrity

      - name: Run URL codec data integrity regression test
        run: npm run test:url-codec-integrity

      - name: Run URL parser security regression test
        run: npm run test:url-parser-security
